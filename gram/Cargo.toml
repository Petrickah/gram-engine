[workspace]
resolver = "2"
members  = ["cli", "common"]

[workspace.dependencies]
clap       = { version = "4.6.6",   features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
ron        = "0.12.2"
serde_json = "1.0.151"

[workspace.package]
name    = "gram-module"
version = "0.1.0"
edition = "2024"