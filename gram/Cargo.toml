[workspace]
resolver = "2"
members  = ["gram-cli", "gram-common", "gram-core"]

[workspace.dependencies]
clap       = { version = "4.6.6",   features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
ron        = "0.12.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
